<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Zhuyz Pro导航后台</title>
    <script>
      (() => {
        try {
          if (localStorage.getItem("wayfind-admin-theme") === "dark") {
            document.documentElement.dataset.theme = "dark";
          }
        } catch {
          // Storage can be unavailable in privacy-restricted browsers.
        }
      })();
    </script>
    <link rel="stylesheet" href="./admin.css" />
    <script src="./lucide.js" defer></script>
    <script src="./admin.js" defer></script>
  </head>
  <body>
    <a class="skip-link" href="#main">跳到主要内容</a>
    <div class="admin-shell">
      <header class="admin-header">
        <a class="admin-brand" href="./" aria-label="Zhuyz Pro导航后台首页">
          <span class="brand-mark" aria-hidden="true"><i data-lucide="route"></i></span>
          <span class="brand-copy"><strong>Zhuyz Pro导航后台</strong><small>WAYFIND CONTROL</small></span>
        </a>
        <div class="header-actions">
          <span id="session-user" class="session-user" hidden></span>
          <span id="front-divider" class="header-divider" aria-hidden="true" hidden></span>
          <a id="front-link" class="front-link" href="https://zhuyzpro.github.io/zhuyz99/" target="_blank" rel="noopener noreferrer" title="打开前台" hidden>
            <i data-lucide="external-link" aria-hidden="true"></i><span>进入前台</span>
          </a>
          <span id="logout-divider" class="header-divider" aria-hidden="true" hidden></span>
          <button id="settings-button" class="icon-button" type="button" title="个人设置" aria-label="个人设置" hidden>
            <i data-lucide="settings-2" aria-hidden="true"></i>
          </button>
          <span id="settings-divider" class="header-divider" aria-hidden="true" hidden></span>
          <button id="logout-button" class="icon-button" type="button" title="退出登录" aria-label="退出登录" hidden>
            <i data-lucide="log-out" aria-hidden="true"></i>
          </button>
        </div>
      </header>

      <main id="main">
        <section id="login-view" class="login-view" aria-labelledby="login-title">
          <p class="eyebrow">PRIVATE ACCESS</p>
          <h1 id="login-title">登录后台</h1>
          <p class="login-copy">管理公开导航里的入口和排序。</p>
          <form id="login-form" class="login-form">
            <label>用户名<input id="login-username" name="username" autocomplete="username" required /></label>
            <label>密码<input id="login-password" name="password" type="password" autocomplete="current-password" required /></label>
            <button class="primary-button" type="submit"><span>登录</span><i data-lucide="arrow-right" aria-hidden="true"></i></button>
            <p id="login-error" class="form-error" role="alert" hidden></p>
          </form>
        </section>

        <section id="dashboard-view" class="dashboard-view" aria-labelledby="dashboard-title" hidden>
          <div class="dashboard-heading">
            <div>
              <p class="eyebrow">LINK DIRECTORY</p>
              <h1 id="dashboard-title">入口管理</h1>
              <p class="dashboard-copy">保存后，公开导航下次刷新即可看到最新内容。</p>
            </div>
            <div class="heading-actions">
              <button id="add-category-button" class="secondary-button" type="button"><i data-lucide="folder-plus" aria-hidden="true"></i><span>新增分类</span></button>
              <button id="add-button" class="primary-button" type="button"><i data-lucide="plus" aria-hidden="true"></i><span>新增入口</span></button>
            </div>
          </div>
          <div id="flash" class="flash" role="status" aria-live="polite" hidden></div>
          <div id="category-panels" class="category-panels"></div>
        </section>
      </main>
    </div>

    <dialog id="link-dialog" class="link-dialog" aria-labelledby="dialog-title">
      <form id="link-form" method="dialog">
        <div class="dialog-header">
          <div><p class="eyebrow">LINK RECORD</p><h2 id="dialog-title">新增入口</h2></div>
          <button id="close-dialog" class="icon-button" type="button" title="关闭" aria-label="关闭"><i data-lucide="x" aria-hidden="true"></i></button>
        </div>
        <div class="form-grid">
          <label>名称<input id="field-title" name="title" maxlength="80" required /></label>
          <label>地址<input id="field-url" name="url" type="url" placeholder="https://" maxlength="2048" required /></label>
          <label>分类<select id="field-category" name="category" required></select></label>
          <label>缩写<input id="field-mark" name="mark" maxlength="12" required /></label>
          <div class="field-stack">
            <label>状态<input id="field-status" name="status" maxlength="24" required /></label>
            <label>后台备注（仅后台可见）<textarea id="field-admin-note" name="adminNote" maxlength="500" rows="2"></textarea></label>
          </div>
          <div class="tone-field">
            <span id="field-tone-label" class="field-label">色调</span>
            <input id="field-tone" name="tone" type="hidden" value="teal" />
            <div id="tone-picker" class="tone-picker" role="radiogroup" aria-labelledby="field-tone-label">
              <button class="tone-option" type="button" data-tone-option="teal" role="radio" aria-checked="true" tabindex="0"><span class="tone-swatch tone-teal" aria-hidden="true"></span><span>青绿</span></button>
              <button class="tone-option" type="button" data-tone-option="coral" role="radio" aria-checked="false" tabindex="-1"><span class="tone-swatch tone-coral" aria-hidden="true"></span><span>珊瑚</span></button>
              <button class="tone-option" type="button" data-tone-option="yellow" role="radio" aria-checked="false" tabindex="-1"><span class="tone-swatch tone-yellow" aria-hidden="true"></span><span>黄色</span></button>
              <button class="tone-option" type="button" data-tone-option="blue" role="radio" aria-checked="false" tabindex="-1"><span class="tone-swatch tone-blue" aria-hidden="true"></span><span>蓝色</span></button>
              <button class="tone-option" type="button" data-tone-option="purple" role="radio" aria-checked="false" tabindex="-1"><span class="tone-swatch tone-purple" aria-hidden="true"></span><span>紫色</span></button>
              <button class="tone-option" type="button" data-tone-option="orange" role="radio" aria-checked="false" tabindex="-1"><span class="tone-swatch tone-orange" aria-hidden="true"></span><span>橙色</span></button>
              <button class="tone-option" type="button" data-tone-option="rose" role="radio" aria-checked="false" tabindex="-1"><span class="tone-swatch tone-rose" aria-hidden="true"></span><span>玫红</span></button>
              <button class="tone-option" type="button" data-tone-option="lime" role="radio" aria-checked="false" tabindex="-1"><span class="tone-swatch tone-lime" aria-hidden="true"></span><span>青柠</span></button>
              <button class="tone-option" type="button" data-tone-option="indigo" role="radio" aria-checked="false" tabindex="-1"><span class="tone-swatch tone-indigo" aria-hidden="true"></span><span>靛蓝</span></button>
            </div>
          </div>
          <label class="full-width">前台简介<textarea id="field-description" name="description" maxlength="240" rows="3" required></textarea></label>
          <label class="full-width">前台说明<input id="field-note" name="note" maxlength="80" required /></label>
        </div>
        <p id="dialog-error" class="form-error" role="alert" hidden></p>
        <div class="dialog-actions"><button id="cancel-dialog" class="secondary-button" type="button">取消</button><button class="primary-button" type="submit"><span>保存入口</span><i data-lucide="check" aria-hidden="true"></i></button></div>
      </form>
    </dialog>

    <dialog id="settings-dialog" class="link-dialog" aria-labelledby="settings-dialog-title">
      <form id="settings-form" method="dialog">
        <div class="dialog-header">
          <div><p class="eyebrow">PERSONAL SETTINGS</p><h2 id="settings-dialog-title">修改密码</h2></div>
          <button id="close-settings-dialog" class="icon-button" type="button" title="关闭" aria-label="关闭"><i data-lucide="x" aria-hidden="true"></i></button>
        </div>
        <div class="form-grid">
          <label class="full-width">当前密码<input id="current-password" name="currentPassword" type="password" autocomplete="current-password" required /></label>
          <label>新密码<input id="new-password" name="newPassword" type="password" minlength="12" maxlength="200" autocomplete="new-password" required /></label>
          <label>确认新密码<input id="confirm-password" name="confirmPassword" type="password" minlength="12" maxlength="200" autocomplete="new-password" required /></label>
        </div>
        <p class="settings-hint">新密码至少需要 12 个字符。保存后需要重新登录。</p>
        <p id="settings-error" class="form-error" role="alert" hidden></p>
        <div class="dialog-actions"><button id="cancel-settings-dialog" class="secondary-button" type="button">取消</button><button class="primary-button" type="submit"><span>保存密码</span><i data-lucide="check" aria-hidden="true"></i></button></div>
      </form>
    </dialog>

    <dialog id="category-dialog" class="link-dialog" aria-labelledby="category-dialog-title">
      <form id="category-form" method="dialog">
        <div class="dialog-header">
          <div><p class="eyebrow">CATEGORY RECORD</p><h2 id="category-dialog-title">新增分类</h2></div>
          <button id="close-category-dialog" class="icon-button" type="button" title="关闭" aria-label="关闭"><i data-lucide="x" aria-hidden="true"></i></button>
        </div>
        <div class="form-grid">
          <label class="full-width">分类名称<input id="category-name" name="name" maxlength="40" required /></label>
          <label class="full-width">分类说明<input id="category-description" name="description" maxlength="120" placeholder="例如：工作中经常使用的服务" /></label>
        </div>
        <p id="category-dialog-error" class="form-error" role="alert" hidden></p>
        <div class="dialog-actions"><button id="cancel-category-dialog" class="secondary-button" type="button">取消</button><button class="primary-button" type="submit"><span id="save-category-label">保存分类</span><i data-lucide="check" aria-hidden="true"></i></button></div>
      </form>
    </dialog>

    <dialog id="category-delete-dialog" class="link-dialog" aria-labelledby="category-delete-title">
      <form id="category-delete-form" method="dialog">
        <div class="dialog-header">
          <div><p class="eyebrow">CATEGORY ACTION</p><h2 id="category-delete-title">删除分类</h2></div>
          <button id="close-category-delete-dialog" class="icon-button" type="button" title="关闭" aria-label="关闭"><i data-lucide="x" aria-hidden="true"></i></button>
        </div>
        <p id="category-delete-message" class="delete-message"></p>
        <label id="category-target-label">将入口移动到<select id="category-target" name="targetCategoryId" required></select></label>
        <p id="category-delete-error" class="form-error" role="alert" hidden></p>
        <div class="dialog-actions"><button id="cancel-category-delete-dialog" class="secondary-button" type="button">取消</button><button class="danger-button" type="submit"><i data-lucide="trash-2" aria-hidden="true"></i><span>删除分类</span></button></div>
      </form>
    </dialog>

    <button id="theme-toggle" class="theme-toggle" type="button" title="切换深色模式" aria-label="切换深色模式">
      <i data-lucide="moon" aria-hidden="true"></i>
    </button>
  </body>
</html>
