<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="航迹：中转站与其他常用网站导航。" />
    <title>航迹 · 网站导航</title>
    <script>
      (() => {
        try {
          if (localStorage.getItem("wayfind-theme") === "light") {
            document.documentElement.dataset.theme = "light";
          }
        } catch {
          // Storage can be unavailable in privacy-restricted browsers.
        }
      })();
    </script>
    <link rel="stylesheet" href="styles.css" />
    <script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.js" defer></script>
    <script src="app.js" defer></script>
  </head>
  <body>
    <a class="skip-link" href="#main">跳到主要内容</a>

    <div class="site-shell">
      <header class="site-header">
        <a class="brand" href="./" aria-label="航迹首页">
          <span class="brand-mark" aria-hidden="true"><i data-lucide="route"></i></span>
          <span class="brand-text">
            <strong>航迹</strong>
            <small>WAYFIND</small>
          </span>
        </a>
        <div class="header-meta">
          <span>常用网站导航</span>
          <a href="https://github.com/zhuyzPro/zhuyz99" target="_blank" rel="noopener noreferrer" aria-label="查看项目 GitHub" title="查看项目 GitHub">
            <i data-lucide="github" aria-hidden="true"></i>
          </a>
        </div>
      </header>

      <main id="main">
        <section class="intro" aria-labelledby="page-title">
          <p class="eyebrow">PERSONAL NAVIGATION</p>
          <h1 id="page-title">常用入口，<br /><em>分路抵达。</em></h1>
          <p class="intro-copy">把常用的中转服务和日常网站放在一起，需要时直接出发。</p>
        </section>

        <nav id="section-nav" class="section-nav" aria-label="页面分区"></nav>

        <div class="sections" id="link-sections"></div>
      </main>

      <footer class="site-footer">
        <span>航迹 · 网站导航</span>
        <span>链接与状态以目标站点为准</span>
      </footer>
    </div>

    <button id="theme-toggle" class="theme-toggle" type="button" title="切换浅色模式" aria-label="切换浅色模式">
      <i data-lucide="moon" aria-hidden="true"></i>
    </button>
  </body>
</html>
