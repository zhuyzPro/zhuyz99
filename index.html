<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Zhuyz Pro导航：中转站与其他常用网站导航。" />
    <title>Zhuyz Pro导航</title>
    <script>
      (() => {
        try {
          if (localStorage.getItem("wayfind-theme") === "light") {
            document.documentElement.dataset.theme = "light";
          }
        } catch {
          // Storage can be unavailable in privacy-restricted browsers.
        }
      })();
    </script>
    <link rel="stylesheet" href="styles.css" />
    <script src="lucide.js" defer></script>
    <script src="app.js" defer></script>
  </head>
  <body>
    <a class="skip-link" href="#main">跳到主要内容</a>

    <div class="site-shell">
      <header class="site-header">
        <a class="brand" href="./" aria-label="Zhuyz Pro导航首页">
          <span class="site-status" role="status"><span class="status-dot" aria-hidden="true"></span>持续更新</span>
          <span class="brand-text">
            <strong>Zhuyz Pro导航</strong>
            <small>WAYFIND</small>
          </span>
        </a>
      </header>

      <main id="main">
        <section class="intro" aria-labelledby="page-title">
          <p class="eyebrow">PERSONAL NAVIGATION</p>
          <h1 id="page-title"><span class="headline-gradient">常用入口，<br /><em>分路抵达。</em></span></h1>
          <p class="intro-copy">把常用的中转服务和日常网站放在一起，需要时直接出发。</p>
        </section>

        <nav id="section-nav" class="section-nav" aria-label="页面分区"></nav>

        <div class="sections" id="link-sections"></div>
      </main>

      <footer class="site-footer">
        <span>Zhuyz Pro导航</span>
        <span>链接与状态以目标站点为准</span>
      </footer>
    </div>

    <button id="theme-toggle" class="theme-toggle" type="button" title="切换浅色模式" aria-label="切换浅色模式">
      <i data-lucide="moon" aria-hidden="true"></i>
    </button>
  </body>
</html>
