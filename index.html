<!doctype html>
<html lang="zh-CN" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="航迹是一张轻量、可搜索、可收藏的个人网址导航页。" />
    <meta name="theme-color" content="#0a1622" />
    <title>航迹 · 个人导航</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.js" defer></script>
    <script src="app.js" defer></script>
  </head>
  <body>
    <a class="skip-link" href="#main">跳到主要内容</a>

    <div class="app-shell">
      <header class="topbar" aria-label="站点导航">
        <a class="brand" href="./" aria-label="航迹首页">
          <span class="brand-mark" aria-hidden="true"><i data-lucide="route"></i></span>
          <span class="brand-copy">
            <strong>航迹</strong>
            <span>WAYFIND</span>
          </span>
        </a>

        <div class="topbar-actions">
          <span class="local-status"><span class="status-dot" aria-hidden="true"></span>本地资料库</span>
          <button class="icon-button" id="theme-toggle" type="button" aria-label="切换主题" title="切换主题">
            <i data-lucide="sun"></i>
          </button>
          <a class="icon-button" href="https://github.com/zhuyzPro/zhuyz99" target="_blank" rel="noopener noreferrer" aria-label="打开项目 GitHub" title="打开项目 GitHub">
            <i data-lucide="github"></i>
          </a>
        </div>
      </header>

      <main id="main" class="main-content">
        <section class="hero-band" aria-labelledby="page-title">
          <div class="hero-copy">
            <p class="eyebrow">PERSONAL START PAGE <span aria-hidden="true">/</span> 2026</p>
            <h1 id="page-title">今天要去哪里？</h1>
            <p class="hero-note">把常用入口收进一张清晰的地图。</p>
          </div>
          <div class="hero-time" aria-label="当前时间">
            <time id="clock" datetime="">09:41</time>
            <span id="date-label">星期三 · 8月26日</span>
          </div>
        </section>

        <section class="toolbar" aria-label="导航工具">
          <label class="search-field" for="search-input">
            <i data-lucide="search" aria-hidden="true"></i>
            <span class="sr-only">搜索站点</span>
            <input id="search-input" type="search" placeholder="搜索站点、描述或标签" autocomplete="off" spellcheck="false" />
            <button class="clear-search" id="clear-search" type="button" aria-label="清除搜索" title="清除搜索" hidden>
              <i data-lucide="x" aria-hidden="true"></i>
            </button>
          </label>
        </section>

        <section class="category-bar" aria-label="站点分类">
          <div class="category-tabs" id="category-tabs" role="tablist" aria-label="选择分类"></div>
          <p class="results-count" id="results-count" aria-live="polite"></p>
        </section>

        <section class="content-layout">
          <div class="link-area">
            <div class="link-grid" id="link-grid" aria-live="polite"></div>
            <div class="empty-state" id="empty-state" hidden>
              <div class="empty-icon" aria-hidden="true"><i data-lucide="compass"></i></div>
              <h2>没有找到匹配入口</h2>
              <p>换个关键词试试。</p>
            </div>
          </div>

          <aside class="favorites-panel" aria-labelledby="favorites-title">
            <div class="panel-heading">
              <div>
                <p class="panel-kicker">QUICK ACCESS</p>
                <h2 id="favorites-title">已收藏</h2>
              </div>
              <span class="count-badge" id="favorite-count">0</span>
            </div>
            <div class="favorite-list" id="favorite-list"></div>
            <div class="panel-footer">
              <span>偏好保存在这台设备</span>
              <button class="text-button" id="clear-favorites" type="button">清空</button>
            </div>
          </aside>
        </section>
      </main>

      <footer class="site-footer">
        <span>航迹 · 个人导航页</span>
        <span id="footer-status">内容随时可改，入口始终在手边。</span>
      </footer>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
  </body>
</html>
